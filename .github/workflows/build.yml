# Builds eXViewer for macOS, Windows and Linux, and uploads the packages.
#
# macOS and Windows builds are VMP-signed with castlabs EVS so Widevine
# plays protected streams. Set these repository secrets (Settings > Secrets
# and variables > Actions) to your EVS account:
#   EVS_ACCOUNT_NAME  the EVS account name
#   EVS_PASSWD        its password
# Linux has no VMP, so its build is not signed.
name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      # EVS fails instead of prompting for anything missing.
      EVS_NO_ASK: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            platform: darwin
            arch: arm64
            vmp: true
          - name: macOS (Intel)
            os: macos-latest
            platform: darwin
            arch: x64
            vmp: true
          - name: Windows
            os: windows-latest
            platform: win32
            arch: x64
            vmp: true
          - name: Linux
            os: ubuntu-latest
            platform: linux
            arch: x64
            vmp: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # The castlabs Electron dependency comes from git, which npm 12 only
      # installs with allow-git (set in .npmrc).
      - name: Install npm 12
        run: npm install --global npm@12

      - name: Install dependencies
        run: npm ci

      - name: Install rpm tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes rpm

      - name: Package
        run: npx electron-forge package --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      # VMP signing has to happen after packaging and before the installers
      # are made (and before any Apple code signing).
      - uses: actions/setup-python@v7
        if: matrix.vmp
        with:
          python-version: '3.x'

      - name: Install castlabs EVS
        if: matrix.vmp
        run: python -m pip install --upgrade castlabs-evs

      - name: Log in to EVS
        if: matrix.vmp
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        shell: bash
        run: python -m castlabs_evs.account reauth -A "$EVS_ACCOUNT_NAME" -P "$EVS_PASSWD"

      - name: VMP-sign the package
        if: matrix.vmp
        shell: bash
        run: python -m castlabs_evs.vmp sign-pkg "out/eXViewer-${{ matrix.platform }}-${{ matrix.arch }}"

      - name: Verify the VMP signature
        if: matrix.vmp
        shell: bash
        run: python -m castlabs_evs.vmp verify-pkg "out/eXViewer-${{ matrix.platform }}-${{ matrix.arch }}"

      - name: Make packages
        run: npx electron-forge make --skip-package --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: eXViewer-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/make/**/*
          if-no-files-found: error
